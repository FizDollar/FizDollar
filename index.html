<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GoddessHub App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { background-color: #1e1e1e; border-radius: 15px; padding: 20px; width: 100%; max-width: 400px; box-sizing: border-box; text-align: center; border: 1px solid #333; }
        .avatar { width: 80px; height: 80px; border-radius: 50%; background-color: #333; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 30px; }
        h1 { font-size: 20px; margin: 0 0 10px; }
        p { color: #aaa; font-size: 14px; margin-bottom: 20px; }
        button { background-color: #2AABEE; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar" id="user-avatar">?</div>
        <h1 id="user-name">Загрузка...</h1>
        <p id="user-id">ID: ...</p>
        <p>Это ваше первое Telegram Mini App!</p>
        <button onclick="tg.showAlert('Привет! Это сообщение из Mini App.')">Нажми меня</button>
    </div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('user-name').innerText = user.first_name + (user.last_name ? ' ' + user.last_name : '');
            document.getElementById('user-id').innerText = 'ID: ' + user.id;
            document.getElementById('user-avatar').innerText = user.first_name.charAt(0).toUpperCase();
        } else {
            document.getElementById('user-name').innerText = "Гость";
        }
    </script>
</body>
</html>
