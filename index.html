<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Магазин FizDollar</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            background-image: url('bg.jpg'); 
            background-size: cover; 
            background-position: center;
            background-attachment: fixed;
            color: #ffffff; 
            font-family: sans-serif; 
            margin: 0; 
            padding: 15px; 
        }
        h1 { text-align: center; font-size: 24px; margin-bottom: 20px; text-shadow: 1px 1px 3px black; }
        .product-grid { display: flex; flex-direction: column; gap: 15px; }
        .product-card { 
            background-color: rgba(30, 30, 30, 0.9); 
            backdrop-filter: blur(5px);
            border-radius: 15px; 
            padding: 15px; 
            display: flex; 
            align-items: center; 
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .product-img { width: 70px; height: 70px; border-radius: 10px; background-color: #444; margin-right: 15px; object-fit: cover; }
        .product-info { flex: 1; }
        .product-title { font-size: 16px; font-weight: bold; margin: 0 0 5px; }
        .product-price { font-size: 14px; color: #2AABEE; font-weight: bold; margin: 0; }
        .buy-btn { 
            background-color: #2AABEE; 
            color: white; 
            border: none; 
            padding: 8px 15px; 
            border-radius: 8px; 
            font-size: 14px; 
            cursor: pointer; 
            font-weight: bold;
        }
        .buy-btn:active { opacity: 0.7; }
    </style>
</head>
<body>
    <h1>Наш Магазин</h1>
    
    <div class="product-grid">
        <!-- Товар 1 -->
        <div class="product-card">
            <img src="https://i.pinimg.com/736x/8e/6c/6d/8e6c6d6e4f4c2f3a6b7e8d9c0a1b2c3d.jpg" class="product-img" alt="Товар">
            <div class="product-info">
                <p class="product-title">Курс по арбитражу</p>
                <p class="product-price">500 ₽</p>
            </div>
            <button class="buy-btn" onclick="buyItem('Курс по арбитражу', 500)">Купить</button>
        </div>

        <!-- Товар 2 -->
        <div class="product-card">
            <img src="https://i.pinimg.com/736x/8e/6c/6d/8e6c6d6e4f4c2f3a6b7e8d9c0a1b2c3d.jpg" class="product-img" alt="Товар">
            <div class="product-info">
                <p class="product-title">Доступ в закрытый чат</p>
                <p class="product-price">1500 ₽</p>
            </div>
            <button class="buy-btn" onclick="buyItem('Доступ в закрытый чат', 1500)">Купить</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Функция, которая срабатывает при нажатии на "Купить"
        function buyItem(name, price) {
            // Показываем окошко (пока это просто имитация оплаты)
            tg.showAlert(`Вы выбрали: ${name}. Цена: ${price} руб. (Здесь будет оплата)`);
            
            // В будущем здесь будет отправка данных вашему боту для выставления счета
        }
    </script>
</body>
</html>
